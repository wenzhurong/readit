name: oracle-drift

# 手动触发，不再有定时。2026-08-12 由项目所有者裁定（SPEC §13.4 已同步）。
#
# 指标调整：项目要的是「产出与 GitHub 的 Markdown 阅读器**高度相似**」，
# GitHub 的输出被选作最高参考标准——但**不需要长期保持逐字节一致**。
# 保真度对着 packages/core/test/fixtures/ 这份**钉住的快照**衡量，
# 而不是对着实时的 GitHub。快照本身仍是从真 oracle 抓来的，只是不再每天重抓。
#
# 为什么留着这条 workflow 而不是删掉：机器还有用，只是不该每天叫人。
# 想主动看一眼 GitHub 有没有变（发版前、收到渲染差异的反馈时、
# 或要重钉快照时），在 Actions 页面手动跑一次即可 —— 它照旧会刷新 fixture、
# 掩掉三个每次请求都变的随机量、只在真 drift 上开 PR 并附诊断产物。
#
# 定时版本此前每天报错，根因是仓库级「Allow GitHub Actions to create and
# approve pull requests」开关关着（workflow 里的 permissions 覆盖不了它）。
# 那个开关已打开，所以手动跑现在能真的开出 PR。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: oracle-drift
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          cache: npm

      - run: npm ci

      # PAT is mandatory (SPEC 13.4). GITHUB_TOKEN gives 1000 req/hour/repo, which is
      # enough for this 68-file corpus, but the secret must be a fine-grained PAT with
      # public read access — ORACLE_PAT — set by a repo admin; GITHUB_TOKEN is only the
      # fallback so this workflow does not silently no-op on a repo without the PAT set.
      - name: Refresh fixtures from the oracle
        env:
          GITHUB_TOKEN: ${{ secrets.ORACLE_PAT || secrets.GITHUB_TOKEN }}
        run: npm run oracle:refresh

      # NOT `git diff --exit-code`. GitHub re-rolls data-run-id, data-identity and the
      # footnote -<32hex> salt on every request, so a raw diff is non-empty on EVERY
      # run and this alarm fired unconditionally from the day it was built — real drift
      # would have arrived as *more* changed files inside a --stat that was never empty.
      # detect-drift.ts masks exactly those three tokens and exits 1 only on a change
      # GitHub actually renders. See scripts/salt-mask.ts for why masked and not
      # normalized (normalization would also silence Linguist and mermaid-markup drift,
      # which is drift worth waking up for).
      - name: Detect drift
        id: drift
        run: |
          if npx tsx packages/core/scripts/detect-drift.ts > drift.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            cat drift.txt
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            cat drift.txt
          fi

      # The refreshed fixtures are the new truth. If they no longer match our renderer, the
      # PR body carries the failing test output so a human can triage without re-running
      # anything. `continue-on-error` because a red corpus suite here is the expected,
      # informative outcome (drift found), not a workflow failure.
      - name: Re-run the corpus suite against the refreshed fixtures
        if: steps.drift.outputs.changed == 'true'
        continue-on-error: true
        run: npx vitest run packages/core/test/corpus.test.ts 2>&1 | tee corpus-after-refresh.txt

      - name: Open a drift PR
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: oracle-drift/auto
          base: main
          commit-message: 'test(fixtures): refresh oracle fixtures (GitHub renderer drift)'
          title: 'Oracle drift: GitHub renderer output changed'
          body-path: drift.txt
          labels: oracle-drift
          add-paths: |
            packages/core/test/fixtures/

      - name: Upload triage artefacts
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-drift-triage
          path: |
            drift.txt
            corpus-after-refresh.txt
