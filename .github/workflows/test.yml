name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A peer gate to `unit`, not a prerequisite of it. Deliberately NOT folded into the unit job:
  #
  #  - It runs once, not three times. tsc's result does not depend on the OS, so putting it in
  #    the matrix would triple the cost for three identical answers.
  #  - It runs ALONGSIDE the tests rather than gating them. Both signals are wanted from a single
  #    push — a type error should not hide whether the suite also went red, and vice versa.
  #
  # What this actually enforces: `strict`, `noUncheckedIndexedAccess` and `verbatimModuleSyntax`.
  # A great deal of this codebase's defensive guarding (every documented `!`, every explicit
  # `?? ''`) exists only to satisfy those flags, and `npm test` cannot enforce them — vitest
  # transpiles TypeScript without type-checking it, so before this job nothing checked them
  # automatically anywhere.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      # Root tsconfig (test/, tools/, vitest.config.ts) plus both workspaces.
      - run: npm run typecheck

  unit:
    name: unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      # test/setup/no-network.ts severs outbound sockets inside the worker,
      # so this run is offline on every OS, including the two with no unshare.
      - run: npm test

  # D2-27 is deliberately wider than the ordinary Windows unit leg. That leg checks out into a
  # short runner path and never compiles the Rust shell, so it cannot detect either the historical
  # `spawn cmd.exe ENOENT` failure from a >260-character dependency path or a Windows-only Rust
  # regression. Keep this as a peer gate: every command below runs from a fresh clone whose root is
  # already long before node_modules and generated dist chunks are appended. Rust uses the same deep
  # manifest/source clone, but its physical target stays short because MSVC link.exe cannot create
  # >260-character /OUT paths; a Windows Rust test separately opens a real >260-character document.
  windows-long-path:
    name: Windows long path + Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Clone the checkout under an extended path
        shell: pwsh
        run: |
          $longPathsEnabled = Get-ItemPropertyValue `
            -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem' `
            -Name LongPathsEnabled
          if ([int]$longPathsEnabled -ne 1) {
            throw "Windows long paths are not enabled on this runner: LongPathsEnabled=$longPathsEnabled"
          }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP is required for the long-path test'
          }
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) {
            throw 'GITHUB_WORKSPACE is required for the long-path test'
          }

          $minimumClonePathLength = 200
          $targetClonePathLength = 210
          if ($targetClonePathLength -lt $minimumClonePathLength) {
            throw "Target clone length $targetClonePathLength is below the $minimumClonePathLength-character gate"
          }

          # Build an exact-length path instead of accepting a segment-sized overshoot. The dependency graph is
          # intentionally unified on one root-level esbuild binary; keeping its executable below MAX_PATH lets
          # vanilla npm lifecycle scripts run while the corpus and generated build outputs remain well above 260.
          $deepRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          $segment = 0
          while ($true) {
            $candidateRoot = Join-Path $deepRoot ("readit-long-path-{0:D2}-abcdefghij" -f $segment)
            $candidateClonePath = Join-Path $candidateRoot 'readit'
            if ($candidateClonePath.Length -gt ($targetClonePathLength - 2)) {
              break
            }
            $deepRoot = $candidateRoot
            $segment += 1
          }

          $unpaddedClonePath = Join-Path $deepRoot 'readit'
          $paddingLength = $targetClonePathLength - $unpaddedClonePath.Length - 1
          if ($paddingLength -lt 1 -or $paddingLength -gt 255) {
            throw "Cannot construct a $targetClonePathLength-character clone path from RUNNER_TEMP=$env:RUNNER_TEMP"
          }
          $deepRoot = Join-Path $deepRoot ('p' * $paddingLength)
          $clonePath = Join-Path $deepRoot 'readit'
          if ($clonePath.Length -ne $targetClonePathLength) {
            throw "Deep clone path length is $($clonePath.Length), expected exactly $targetClonePathLength"
          }

          New-Item -ItemType Directory -Path $deepRoot -Force | Out-Null
          $sourceHead = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($sourceHead)) {
            throw "Could not resolve the current checkout: exit $LASTEXITCODE"
          }
          git -c core.longpaths=true clone --no-hardlinks --no-checkout -- `
            $env:GITHUB_WORKSPACE $clonePath
          if ($LASTEXITCODE -ne 0) {
            throw "Deep clone failed with exit code $LASTEXITCODE"
          }

          # The command-level setting above is needed while Git creates the deep repository.
          # Persist a repository-local setting before checkout so every later Git operation keeps
          # the same contract;
          # never modify the runner's global config or registry to manufacture a green result.
          git -C $clonePath config core.longpaths true
          if ($LASTEXITCODE -ne 0) {
            throw "Could not persist core.longpaths in the deep clone: exit $LASTEXITCODE"
          }
          $configuredLongPaths = (git -C $clonePath config --bool core.longpaths).Trim()
          if ($LASTEXITCODE -ne 0 -or $configuredLongPaths -ne 'true') {
            throw "Deep clone core.longpaths is not true: '$configuredLongPaths'"
          }
          git -C $clonePath checkout --detach $sourceHead
          if ($LASTEXITCODE -ne 0) {
            throw "Could not check out $sourceHead in the deep clone: exit $LASTEXITCODE"
          }
          $clonedHead = (git -C $clonePath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $clonedHead -ne $sourceHead) {
            throw "Deep clone HEAD mismatch: source=$sourceHead clone=$clonedHead"
          }
          if ($clonePath.Length -lt $minimumClonePathLength) {
            throw "Deep clone path is only $($clonePath.Length) characters: $clonePath"
          }

          $longCorpusPath = Join-Path $clonePath `
            'packages\core\test\corpus\adversarial\karlcow\header-level1-hash-sign-trailing-2-spaces.md'
          if ($longCorpusPath.Length -le 260) {
            throw "Tracked corpus path is not beyond MAX_PATH: length=$($longCorpusPath.Length) path=$longCorpusPath"
          }
          $longCorpusBytes = [IO.File]::ReadAllBytes($longCorpusPath)
          if ($longCorpusBytes.Length -eq 0) {
            throw "Tracked long-path corpus is unexpectedly empty: $longCorpusPath"
          }

          Write-Host "LongPathsEnabled=$longPathsEnabled"
          Write-Host "core.longpaths=$configuredLongPaths"
          Write-Host "deep clone length=$($clonePath.Length) path=$clonePath"
          Write-Host "tracked corpus length=$($longCorpusPath.Length) bytes=$($longCorpusBytes.Length)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "READIT_LONG_PATH_ROOT=$clonePath"
      - name: Install dependencies from the deep clone
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:READIT_LONG_PATH_ROOT
          npm ci
          if ($LASTEXITCODE -ne 0) {
            throw "npm ci failed in the deep clone: exit $LASTEXITCODE"
          }

          $expectedNodeModules = Join-Path $env:READIT_LONG_PATH_ROOT 'node_modules'
          $npmRoot = (npm root).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "npm root failed in the deep clone: exit $LASTEXITCODE"
          }
          if (-not [string]::Equals(
              [IO.Path]::GetFullPath($npmRoot),
              [IO.Path]::GetFullPath($expectedNodeModules),
              [StringComparison]::OrdinalIgnoreCase)) {
            throw "Dependencies were not installed in the deep clone: npmRoot=$npmRoot expected=$expectedNodeModules"
          }
          $nodeModulesItem = Get-Item -LiteralPath $expectedNodeModules
          if (($nodeModulesItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Deep-clone node_modules must not be a junction or other reparse point: $expectedNodeModules"
          }

          $esbuildExecutablePath = Join-Path $env:READIT_LONG_PATH_ROOT `
            'node_modules\@esbuild\win32-x64\esbuild.exe'
          if (-not (Test-Path -LiteralPath $esbuildExecutablePath -PathType Leaf)) {
            throw "The unified root-level esbuild executable is missing: $esbuildExecutablePath"
          }
          if ($esbuildExecutablePath.Length -ge 260) {
            throw "The unified esbuild executable exceeds its spawn budget: length=$($esbuildExecutablePath.Length)"
          }
          $esbuildVersion = (& $esbuildExecutablePath --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $esbuildVersion -ne '0.28.2') {
            throw "Root esbuild executable is not usable as 0.28.2: version='$esbuildVersion' exit=$LASTEXITCODE"
          }

          $forbiddenNestedEsbuildPaths = @(
            (Join-Path $env:READIT_LONG_PATH_ROOT 'packages\readit\node_modules\esbuild'),
            (Join-Path $env:READIT_LONG_PATH_ROOT 'node_modules\tsx\node_modules\esbuild')
          )
          foreach ($nestedPath in $forbiddenNestedEsbuildPaths) {
            if (Test-Path -LiteralPath $nestedPath) {
              throw "A nested esbuild copy restored the long native-executable path regression: $nestedPath"
            }
          }

          $rootChalkPackagePath = Join-Path $env:READIT_LONG_PATH_ROOT `
            'node_modules\chalk\package.json'
          $rootChalkEntryPath = Join-Path $env:READIT_LONG_PATH_ROOT `
            'node_modules\chalk\source\index.js'
          $markedNestedChalkPath = Join-Path $env:READIT_LONG_PATH_ROOT `
            'node_modules\marked-terminal\node_modules\chalk'
          $attwChalkPackagePath = Join-Path $env:READIT_LONG_PATH_ROOT `
            'node_modules\@arethetypeswrong\cli\node_modules\chalk\package.json'
          if ($rootChalkPackagePath.Length -ge 260 -or $rootChalkEntryPath.Length -ge 260) {
            throw "Root Chalk exceeds the Node 22 package-import budget: package=$($rootChalkPackagePath.Length) entry=$($rootChalkEntryPath.Length)"
          }
          $rootChalkVersion = (Get-Content -LiteralPath $rootChalkPackagePath -Raw | ConvertFrom-Json).version
          if ($rootChalkVersion -ne '5.6.2') {
            throw "Root Chalk is not the ESM 5.6.2 copy required by marked-terminal: version='$rootChalkVersion'"
          }
          if (Test-Path -LiteralPath $markedNestedChalkPath) {
            throw "marked-terminal restored the >260-character Chalk 5 package-import path: $markedNestedChalkPath"
          }
          $attwChalkVersion = (Get-Content -LiteralPath $attwChalkPackagePath -Raw | ConvertFrom-Json).version
          if ($attwChalkVersion -ne '4.1.2') {
            throw "ATTW must retain its compatible Chalk 4 dependency: version='$attwChalkVersion'"
          }
          Write-Host "npm root=$npmRoot"
          Write-Host "esbuild length=$($esbuildExecutablePath.Length) version=$esbuildVersion"
          Write-Host `
            "root Chalk package length=$($rootChalkPackagePath.Length) entry length=$($rootChalkEntryPath.Length) version=$rootChalkVersion"
          Write-Host "ATTW nested Chalk version=$attwChalkVersion"
      - name: Run unit tests from the deep clone
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:READIT_LONG_PATH_ROOT
          npm test
          if ($LASTEXITCODE -ne 0) {
            throw "npm test failed in the deep clone: exit $LASTEXITCODE"
          }
      - name: Build and typecheck from the deep clone
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:READIT_LONG_PATH_ROOT
          npm run typecheck
          if ($LASTEXITCODE -ne 0) {
            throw "npm run typecheck failed in the deep clone: exit $LASTEXITCODE"
          }

          $distPath = Join-Path $env:READIT_LONG_PATH_ROOT 'packages\readit\dist'
          $longestBuildOutput = Get-ChildItem -LiteralPath $distPath -File -Recurse |
            Sort-Object { $_.FullName.Length } -Descending |
            Select-Object -First 1
          if ($null -eq $longestBuildOutput) {
            throw "The deep-clone build produced no files under $distPath"
          }
          if ($longestBuildOutput.FullName.Length -le 260) {
            throw "No generated build output crossed MAX_PATH: longest=$($longestBuildOutput.FullName.Length)"
          }
          $buildOutputStream = [IO.File]::OpenRead($longestBuildOutput.FullName)
          try {
            if ($buildOutputStream.Length -eq 0) {
              throw "The longest generated build output is empty: $($longestBuildOutput.FullName)"
            }
          } finally {
            $buildOutputStream.Dispose()
          }
          Write-Host `
            "longest build output length=$($longestBuildOutput.FullName.Length) path=$($longestBuildOutput.FullName)"
      - name: Run the Windows Rust shell tests from the deep clone
        shell: pwsh
        run: |
          Set-Location -LiteralPath $env:READIT_LONG_PATH_ROOT

          $runnerTempPath = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd(
            [IO.Path]::DirectorySeparatorChar
          )
          $cargoTargetName = "readit-cargo-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $cargoTargetPath = [IO.Path]::GetFullPath((Join-Path $runnerTempPath $cargoTargetName))
          $runnerTempPrefix = $runnerTempPath + [IO.Path]::DirectorySeparatorChar
          if (-not $cargoTargetPath.StartsWith(
              $runnerTempPrefix,
              [StringComparison]::OrdinalIgnoreCase)) {
            throw "Cargo target escaped RUNNER_TEMP: target=$cargoTargetPath temp=$runnerTempPath"
          }
          if ($cargoTargetPath.Length -ge 160) {
            throw "Cargo target root leaves too little linker path budget: length=$($cargoTargetPath.Length)"
          }
          if (Test-Path -LiteralPath $cargoTargetPath) {
            throw "Cargo target must be a fresh per-attempt directory: $cargoTargetPath"
          }
          New-Item -ItemType Directory -Path $cargoTargetPath | Out-Null
          $cargoTargetItem = Get-Item -LiteralPath $cargoTargetPath
          if (($cargoTargetItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) {
            throw "Cargo target must be a physical directory, not a reparse point: $cargoTargetPath"
          }

          $cargoManifestPath = Join-Path $env:READIT_LONG_PATH_ROOT 'shell\src-tauri\Cargo.toml'
          $env:CARGO_TARGET_DIR = $cargoTargetPath
          $env:CARGO_TERM_COLOR = 'never'
          Write-Host `
            "Cargo source root length=$($env:READIT_LONG_PATH_ROOT.Length) manifest length=$($cargoManifestPath.Length)"
          Write-Host "Cargo physical target length=$($cargoTargetPath.Length) path=$cargoTargetPath"

          cargo test --manifest-path $cargoManifestPath
          if ($LASTEXITCODE -ne 0) {
            throw "cargo test failed in the deep clone: exit $LASTEXITCODE"
          }

          $longPathTestName = 'document::tests::opens_an_extended_length_windows_document_path'
          $longPathTestOutput = @(
            cargo test --manifest-path $cargoManifestPath $longPathTestName -- --exact 2>&1
          )
          $longPathTestExit = $LASTEXITCODE
          $longPathTestOutput | ForEach-Object { Write-Host $_ }
          if ($longPathTestExit -ne 0) {
            throw "The Windows extended-length document test failed: exit $longPathTestExit"
          }
          $longPathTestText = $longPathTestOutput -join [Environment]::NewLine
          $escapedLongPathTestName = [regex]::Escape($longPathTestName)
          $longPathTestMatches = [regex]::Matches(
            $longPathTestText,
            "(?m)^test $escapedLongPathTestName \.\.\. ok\r?$"
          )
          if ($longPathTestMatches.Count -ne 1) {
            throw "The Windows extended-length document test did not run exactly once"
          }

          $cargoOutputs = @(Get-ChildItem -LiteralPath $cargoTargetPath -File -Recurse)
          $longestCargoOutput = $cargoOutputs |
            Sort-Object { $_.FullName.Length } -Descending |
            Select-Object -First 1
          if ($null -eq $longestCargoOutput) {
            throw "Cargo produced no files under $cargoTargetPath"
          }
          if ($longestCargoOutput.FullName.Length -ge 260) {
            throw "Cargo target did not preserve the MSVC linker budget: longest=$($longestCargoOutput.FullName.Length)"
          }
          if ($null -eq ($cargoOutputs | Where-Object Length -gt 0 | Select-Object -First 1)) {
            throw "Cargo produced no non-empty files under $cargoTargetPath"
          }
          Write-Host `
            "longest Cargo output length=$($longestCargoOutput.FullName.Length) path=$($longestCargoOutput.FullName)"

  # The wall-clock perf assertions (packages/element/test/*.perf.ts) live outside the default
  # `npm test` on purpose — review C2: running an absolute wall-clock number as a blocking gate
  # across a three-OS matrix, on a Windows runner that is routinely 2-5x slower on CPU-bound Node
  # work, buys flakes rather than signal. But "outside the matrix" must not mean "outside CI":
  # a sentinel nothing runs is strictly worse than a flaky one, because a real regression now
  # goes unnoticed forever instead of noisily. So it runs here — once, on the OS the recorded
  # baseline was calibrated against.
  #
  # This job blocks, like every other job here. ci-wiring.test.ts forbids the advisory-job key
  # across this whole workflow — as a bare substring, so even naming it in a comment trips the
  # guard — and that reason applies verbatim here. If this job should not block a merge, delete
  # it and say why; do not leave a check that looks like a gate and is not.
  perf:
    name: perf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.20.0'
          cache: npm
      - run: npm ci
      - run: npm run test:perf
