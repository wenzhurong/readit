name: release desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # Each action invocation merges its updater entry into latest.json. Serializing the
      # matrix prevents two jobs from replacing the manifest from the same stale snapshot.
      max-parallel: 1
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './shell/src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: shell
          tauriScript: npm run tauri
          tagName: readit-v__VERSION__
          releaseName: 'readit v__VERSION__'
          releaseBody: 'Unsigned macOS and Windows builds. Manual acceptance status is recorded in the repository.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
