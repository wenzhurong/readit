name: release desktop

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      # Each action invocation merges its updater entry into latest.json. Serializing the
      # matrix prevents two jobs from replacing the manifest from the same stale snapshot.
      max-parallel: 1
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.20.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './shell/src-tauri -> target'
      - run: npm ci
      # packages/readit 的 dist/ 不进仓库，而 shell 的 vite 构建正是通过 exports 走它
      # （"readit/element" → ./dist/element.js）。test 与 typecheck 两条路径分别靠
      # vitest 的 globalSetup 和 typecheck 脚本隐式把它构建出来了，唯独这条发布路径没有。
      # 2026-08-19 首次真跑，三个 job 全部挂在 vite 阶段：
      #   Rolldown failed to resolve import "readit/element"
      # 本地之所以一直没暴露，只是因为开发机上有早先留下的 dist 残留。
      - run: npm run build
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: shell
          tauriScript: npm run tauri
          tagName: readit-v__VERSION__
          releaseName: 'readit v__VERSION__'
          releaseBody: 'Unsigned macOS and Windows builds. Manual acceptance status is recorded in the repository.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
